[package]
name = "joshconfig"
version = "0.1.0"
edition = "2021"
authors = ["Josh rodd <josh@gitlab.com>"]
description = "Analyze shell config files and manage PATH/MANPATH"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
dirs = "5.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "joshconfig"
path = "src/main.rs"


[[bin]]
name = "joshconfig-env"
path = "src/bin/env.rs"